[project]
name = "reverseai"
version = "1.0.0"
description = "AI agents that rebuild a web application from its observable behavior: clean-room, with an audit trail"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "drkokorev" }]
keywords = ["clean-room", "reimplementation", "llm-agents", "playwright", "reverse-engineering", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "playwright>=1.48",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]

[project.urls]
Repository = "https://github.com/drkokorev/ReverseAI"

[project.scripts]
reverseai = "reverseai.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reverseai"]
# Non-Python package data, listed so it ships even if a pattern ever ignores it.
artifacts = [
    "src/reverseai/console/templates/*.html",
    "src/reverseai/console/static/*",
    "src/reverseai/config/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: needs Playwright Chromium",
    "docker: needs a running Docker daemon",
    "live: needs real API keys",
]
addopts = "-m 'not live' --import-mode=importlib"
filterwarnings = [
    # Starlette >= 1.x wants its own `httpx2` fork for TestClient and warns once on import when
    # it falls back to `httpx`. The fallback works; the project keeps `httpx` (also a runtime
    # dependency) until FastAPI's TestClient needs httpx2. Only this one message is silenced.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
