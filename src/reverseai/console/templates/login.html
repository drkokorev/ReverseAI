{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block page_class %}tight{% endblock %}
{% block content %}
<section class="hero">
  <div class="hero-text">
    <div class="eyebrow">ДОСТУП{% if status %} · {{ status }}{% endif %}</div>
    <h1 class="display display-sm">{{ title }}</h1>
    <p class="lede">{{ message }}</p>
  </div>
</section>

<form class="form stack" action="/login" method="post" autocomplete="off">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <label class="field">Токен доступа (значение REVERSEAI_CONSOLE_TOKEN)
    <input name="token" type="password" required autocomplete="current-password">
  </label>
  <div><button type="submit" class="btn btn-primary">ВОЙТИ</button></div>
</form>
{% endblock %}
